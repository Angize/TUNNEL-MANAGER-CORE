name: ci

# The core builds and ships for linux only, and every one of its 82 carrier files says so with a
# //go:build linux tag. Six files exist to keep the other GOOS compiling anyway. Nothing ever built
# them, so they rotted: DialRaw and ListenRaw in the stub had drifted a whole parameter out of step
# with the real ones, ListenSpoof and DialSpoof still carried a time.Duration nobody passes any more,
# and the tun device was missing WriteBatch entirely. None of it was visible, because the release
# workflow builds GOOS=linux and stops.
#
# It also runs the tests. That used to be skipped on the grounds that they "want the real network", and
# for some of them that is true -- the raw-socket ones need root and skip themselves without it. But the
# rotation, pool and carrier-conformance suites are entirely in-process, and leaving them to a human
# remembering to run them on DE02 is how a guard stops guarding. Anything that genuinely cannot run here
# skips itself; anything that fails here was going to fail on DE02 too.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: gofmt leaves nothing to say
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: it builds and vets on linux
        run: |
          go build ./...
          go vet ./...

      - name: the tests run
        run: go test -timeout 20m ./...

      - name: and it still compiles for every GOOS the tree claims
        run: |
          fail=0
          for os in darwin windows freebsd; do
            for arch in amd64 arm64; do
              if ! GOOS=$os GOARCH=$arch go build -gcflags=-e ./... ; then
                echo "::error::$os/$arch does not build"
                fail=1
              fi
            done
          done
          exit $fail
